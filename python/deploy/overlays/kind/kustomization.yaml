# For a power-kind cluster. Its power is synthetic: this proves the wiring,
# not the model.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
patches:
  - target: {kind: DaemonSet}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: POWERMODEL_CPU_MODEL, value: kind}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: POWERMODEL_MACHINE_TYPE, value: kind}
